        <div class="book-prose"><p>뮤지컬 〈난릉〉은 가면 속 두 남자의 이야기입니다.</p>
          <p>가면을 쓰고 전쟁터에 나가 공을 세워 난릉왕이라 불리는 고장공.</p>
          <p>이미 용상에 앉아 있으면서도 난릉왕의 가면을 쓰고, 그가 되고 싶었던 황제 고위.</p>
          <p>〈난릉〉은 두 사람의 닮은 운명을 통해 가면과 정체성, 권력과 욕망에 관한 질문을 던집니다.</p></div>
