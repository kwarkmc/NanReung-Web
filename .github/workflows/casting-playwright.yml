name: Casting board browser verification
on:
  push:
    branches: [qa/casting-playwright]
permissions:
  contents: read
  statuses: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Test checked-out casting board
        id: checkout-test
        run: node scripts/test_casting.cjs
      - name: Test published casting board
        if: ${{ success() || steps.checkout-test.outcome == 'failure' }}
        id: live-test
        run: node scripts/test_casting.cjs https://kwarkmc.github.io/NanReung-Web/casting/ https://kwarkmc.github.io/NanReung-Web/casting/scroll/
      - name: Record verification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_OUTCOME: ${{ steps.checkout-test.outcome }}
          LIVE_OUTCOME: ${{ steps.live-test.outcome }}
        run: |
          if [[ "$CHECKOUT_OUTCOME" == "success" && "$LIVE_OUTCOME" == "success" ]]; then state=success; else state=failure; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=casting-playwright \
            -f description="Checkout: $CHECKOUT_OUTCOME; GitHub Pages: $LIVE_OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
